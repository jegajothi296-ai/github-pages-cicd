<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills - DevOps Project</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    color: white;
    background: #0f172a;
}
.container {
    text-align: center;
}
        body { margin: 0; padding: 0; }
        .container { margin-top: 30px; }
        .top-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            width: 100%;
        }
        .top-nav a {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        .top-nav a:hover {
            background: #1e293b;
            color: #3b82f6;
        }
        .skill-box {
            width: 80%;
            max-width: 500px;
            margin: 15px auto;
            text-align: left;
        }
        .skill-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .bar-bg {
            background: #333;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            transition: width 1.2s ease-in-out;
        }
        .add-form {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
        }
        .add-form input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }
        .add-form button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .add-form button:hover { background: #2563eb; }
        .delete-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 12px;
    margin-left: 10px;
}
