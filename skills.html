<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills - DevOps Project</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            color: white;
            background: #0f172a;
        }
        .container {
            text-align: center;
            margin-top: 30px;
        }
        .top-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 15px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            width: 100%;
        }
        .top-nav a {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        .top-nav a:hover {
            background: #1e293b;
            color: #3b82f6;
        }
        .skill-box {
            width: 80%;
            max-width: 500px;
            margin: 15px auto;
            text-align: left;
        }
        .skill-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .bar-bg {
            background: #333;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            transition: width 1.2s ease-in-out;
        }
        .add-form {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
        }
        .add-form input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }
        .add-form button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .add-form button:hover { background: #2563eb; }
        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">🏠 Home</a>
        <a href="about.html">ℹ️ About</a>
        <a href="pipeline.html">⚙️ Pipeline</a>
        <a href="skills.html">📈 Skills</a>
        <a href="projects.html">🗂️ Projects</a>
    </nav>

    <div class="container">
        <h1>My Skills</h1>
        <p>Add your skills below — saved on this device only.</p>

        <div id="skillsList"></div>

        <div class="add-form">
            <h3>Add a Skill</h3>
            <input type="text" id="skillName" placeholder="Skill name (e.g. React)">
            <input type="number" id="skillScore" placeholder="Score (0-100)" min="0" max="100">
            <br>
            <button onclick="addSkill()">Add Skill</button>
        </div>
    </div>

    <script>
        function getSkills() {
            return JSON.parse(localStorage.getItem('mySkills')) || [];
        }
        function saveSkills(skills) {
            localStorage.setItem('mySkills', JSON.stringify(skills));
        }
        function renderSkills() {
            const skills = getSkills();
            const list = document.getElementById('skillsList');
            list.innerHTML = '';
            skills.forEach((s, index) => {
                const box = document.createElement('div');
                box.className = 'skill-box';
                box.innerHTML = `
                    <div class="skill-name">
                        <span>${s.name}</span>
                        <span>${s.score}%
                            <button class="delete-btn" onclick="deleteSkill(${index})">✕</button>
                        </span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width:${s.score}%"></div>
                    </div>
                `;
                list.appendChild(box);
            });
        }
        function addSkill() {
            const name = document.getElementById('skillName').value.trim();
            const score = document.getElementById('skillScore').value;
            if (!name || score === '' || score < 0 || score > 100) {
                alert('Please enter a valid skill name and score (0-100)');
                return;
            }
            const skills = getSkills();
            skills.push({ name: name, score: Number(score) });
            saveSkills(skills);
            document.getElementById('skillName').value = '';
            document.getElementById('skillScore').value = '';
            renderSkills();
        }
        function deleteSkill(index) {
            const skills = getSkills();
            skills.splice(index, 1);
            saveSkills(skills);
            renderSkills();
        }
        renderSkills();
    </script>
</body>
</html>
